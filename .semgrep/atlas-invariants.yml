# Atlas invariant rules for Semgrep.
#
# Each rule mirrors a check in scripts/overseer-check.ts. The two run in
# parallel for now: overseer:check stays the source of truth until each
# rule's parity is verified on a test corpus, then the migration retires
# the corresponding overseer check. Don't delete an overseer check until
# its semgrep rule has matched on the curated fixtures and produced
# identical findings.
#
# Run locally: pnpm lint:semgrep
# Run in CI:   .github/workflows/quality.yml (semgrep job)

rules:
  # --- I1: single ingress chokepoint --------------------------------------
  #
  # Mirrors overseer-check.ts ▸ i1SingleIngress (apps/* outside apps/server/
  # may not import an HTTP server framework). The single ingress is one of
  # Atlas's load-bearing invariants — every operation flows through
  # apps/server, no side doors. See specs/architecture.md ▸ I1 and
  # specs/lifecycle.md.

  - id: atlas-i1-single-ingress
    languages: [typescript, javascript]
    severity: ERROR
    message: |
      I1 violation — only apps/server/ may import an HTTP server framework.

      Atlas has a single ingress chokepoint (apps/server). Every operation —
      UI, CLI, agent — flows through it. No other app may expose HTTP.
      If you genuinely need a new server surface, the answer is to add a
      route under apps/server/src/routes/, not a new server.

      See specs/architecture.md ▸ I1 and specs/lifecycle.md.
    paths:
      include:
        - "apps/"
      exclude:
        - "apps/server/"
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/test/"
        - "**/tests/"
    pattern-regex: |
      from\s+['"](hono|@hono/node-server|express|fastify|koa|@fastify)['"]|http\.createServer\(|https\.createServer\(

  # --- I1 (modules half): no module mounts HTTP ---------------------------
  #
  # Mirrors overseer-check.ts ▸ i1ModulesNoHttp. Modules are pure domain
  # logic over ports — they never bind a port or accept a request directly.
  # If a module needs to expose behaviour, it does so via the intent
  # registry that apps/server already wires.

  - id: atlas-i1-modules-no-http
    languages: [typescript, javascript]
    severity: ERROR
    message: |
      I1 violation — /modules files may not mount HTTP.

      Modules under /modules are pure domain logic over ports. They never
      bind a server, accept a request, or import an HTTP framework. The
      single ingress (apps/server) is the only place this happens.

      See modules/CLAUDE.md and specs/architecture.md ▸ I1.
    paths:
      include:
        - "modules/"
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/test/"
        - "**/tests/"
    pattern-regex: |
      from\s+['"](hono|@hono/node-server|express|fastify|koa)['"]|http\.createServer\(|https\.createServer\(

  # --- UI bar: AtlasElement is the only base class ------------------------
  #
  # Mirrors overseer-check.ts ▸ atlasElementOnly. Every UI class in Atlas
  # extends AtlasElement (or AtlasSurface). Bare HTMLElement, Lit, React
  # wrappers, etc., are not allowed. The one allowlisted file is
  # packages/core/src/component.ts which defines AtlasElement itself.

  - id: atlas-ui-bar-no-bare-element
    languages: [typescript]
    severity: ERROR
    message: |
      UI bar violation — UI classes must extend AtlasElement, not
      HTMLElement / LitElement directly.

      Atlas's UI primitive is AtlasElement (packages/core/src/component.ts);
      surfaces extend AtlasSurface (packages/core/src/surface.ts). New
      components belong in packages/design/src/.

      See packages/core/CLAUDE.md and packages/design/CLAUDE.md.
    paths:
      include:
        - "packages/design/src/"
        - "packages/widgets/src/"
        - "apps/"
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/test/"
        - "**/tests/"
        # The AtlasElement primitive itself is the only file allowed to
        # extend HTMLElement directly. Allowlisted in overseer:check too.
        - "packages/core/src/component.ts"
    patterns:
      - pattern-either:
          - pattern: |
              class $X extends HTMLElement { ... }
          - pattern: |
              class $X extends LitElement { ... }

  # --- Logging contract: no raw console.* in server-side production -------
  #
  # Mirrors eslint.config.ts ▸ no-console rule (server-side production
  # paths only). Forbids `console.log` / `error` / `warn` / `info` /
  # `debug` in apps/server, apps/projection-worker, modules, adapters,
  # and the server-side packages. The structured logger
  # (`ctx.logger.*`, per `@atlas/logging`) is the only sanctioned emit
  # path — see `specs/crosscut/logging.md`.
  #
  # Frontend packages (`packages/core`, `packages/design`, …) are
  # deliberately excluded; the FE telemetry pipeline lives in
  # `packages/core/src/telemetry-pipeline.ts` and is governed by
  # `specs/frontend/observability.md`. Test code, scripts, and CLI
  # bins are exempt — they're allowed `console.*` per the contract.

  - id: atlas-logging-no-console
    languages: [typescript]
    severity: ERROR
    message: |
      Logging contract violation — raw `console.*` is forbidden in
      server-side production paths.

      Use `ctx.logger.<level>(message, fields?)` instead. The active
      context carries correlationId / tenantId / principalId / moduleId
      automatically; callers do not pass these on every log call.

      If you genuinely have no `ctx` available (boot/lifecycle code),
      thread a `Logger` through the constructor (see `SmtpMailer`,
      `PostgresControlPlaneRegistry` for the pattern) or use the
      process-wide `setGuardrailLogger` registry.

      See `specs/crosscut/logging.md` ▸ Forbidden and ▸ Tooling.
    paths:
      include:
        - "apps/server/src/"
        - "apps/projection-worker/src/"
        - "modules/"
        - "adapters/"
        - "packages/platform-core/src/"
        - "packages/logging/src/"
        - "packages/ingress/src/"
        - "packages/metrics/src/"
        - "packages/wasm-host/src/"
        - "packages/schemas/src/"
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/test/"
        - "**/tests/"
        - "**/scripts/"
        - "adapters/policy-cedar/bin/"
    pattern-regex: |
      \bconsole\.(log|error|warn|info|debug)\(

  # --- Type system: no `X as unknown as Y` double-casts ------------------
  #
  # Ported from @atlas/eslint-plugin-widgets ▸ no-double-cast (deleted with
  # the ESLint→oxlint migration). The double-cast is TypeScript's "I give
  # up, trust me" pattern — most legitimate uses are at a small number of
  # well-known boundaries (linkedom DOM shim, cedar-wasm CJS, postgres.js
  # parameter widening, adversarial test fixtures). Suppress with
  # `// nosemgrep: atlas-no-double-cast -- boundary: <reason>` at those
  # sites. Anything else is a typing bug or a missing schema validator.

  - id: atlas-no-double-cast
    languages: [typescript]
    severity: ERROR
    message: |
      `as unknown as <Type>` is a type-system escape hatch. Narrow the
      value through a validator/parser, use `satisfies T`, or add a typed
      factory. If this is a legitimate boundary (linkedom DOM shim,
      third-party library impedance, WASM, adversarial test fixture),
      suppress with `// nosemgrep: atlas-no-double-cast -- boundary: <reason>`.
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/test/"
        - "**/tests/"
        - "packages/eslint-plugin-atlas-widgets/"
    pattern: $X as unknown as $Y

  # --- Style: no runtime arrow functions ---------------------------------
  #
  # Ported from eslint.config.ts ▸ no-restricted-syntax (deleted with the
  # ESLint→oxlint migration; oxlint doesn't support no-restricted-syntax
  # selectors). Arrows are banned EXCEPT when:
  #   1. The body references lexical `this` — converting would silently
  #      rebind `this`, breaking event handlers, lifecycle wiring, timers.
  #   2. The arrow is a class-field initialiser (`foo = () => …`) — class-
  #      field arrows auto-bind to the instance.
  #
  # TS function-type annotations (`(x: number) => number`) are unaffected
  # — Semgrep matches expression positions, not type annotations.
  #
  # Semgrep can't easily express ESLint's `:not(:has(ThisExpression))`
  # selector. The closest pragmatic approximation:
  #   - match arrow expressions
  #   - exclude class-field initialisers via pattern-not-inside
  #   - exclude arrows whose source text contains `this` via
  #     metavariable-regex on the body
  #
  # This is approximate — an arrow that references `this` only inside a
  # nested non-arrow function will still be flagged. Suppress those with
  # `// nosemgrep: atlas-no-arrow-functions -- <reason>`.

  - id: atlas-no-arrow-functions
    languages: [typescript]
    severity: ERROR
    message: |
      Arrow functions are banned (except when they reference lexical `this`
      or are class-field initialisers). Use a named function declaration
      (`function foo() {}`) or a function expression (`function () {}`).
      TS function-type annotations like `(x: number) => number` are fine —
      only the runtime arrow form is banned.
    paths:
      exclude:
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "**/test/"
        - "**/tests/"
        - "scripts/"
        - "packages/eslint-plugin-atlas-widgets/"
        - "tests/"
    patterns:
      - pattern-either:
          - pattern: ($...PARAMS) => $BODY
          - pattern: $P => $BODY
      - pattern-not-inside: |
          class $C {
            ...
            $FIELD = ($...P) => $B;
            ...
          }
      - pattern-not-inside: |
          class $C {
            ...
            $FIELD = $P => $B;
            ...
          }
      - metavariable-pattern:
          metavariable: $BODY
          pattern-not-regex: \bthis\b

  # --- Test discipline: no skipped or todo'd tests ------------------------
  #
  # Banned per user direction (2026-05-22): `.skip` / `.todo` / `xit` /
  # `xdescribe` / `xtest` produce false test-coverage signals — the suite
  # passes green while the assertion is dormant. SDET adversarial review
  # found 11 critical findings tied directly to skipped or todo'd tests
  # (see tickets/testing-floor/sdet-review/00-rollup.md).
  #
  # Env-gated suites that previously used `const d = baseUrl ? describe :
  # describe.skip;` MUST refactor to:
  #
  #   if (baseUrl) {
  #     describe('parity — health', function () { ... });
  #   } else {
  #     describe('parity — health (skipped: TEST_BASE_URL not set)', function () {});
  #   }
  #
  # Or, for inline DB-availability checks inside a describe block,
  # `return;` out of the callback early — see adapters/node/test/*.test.ts
  # for the pattern.
  #
  # oxlint doesn't support `no-restricted-syntax` selectors (same reason
  # `atlas-no-arrow-functions` is here, not in .oxlintrc.json).

  - id: atlas-no-skipped-tests
    languages: [typescript]
    severity: ERROR
    message: |
      Banned in Atlas: `.skip` / `.todo` / `xit` / `xtest` / `xdescribe`
      produce false test-coverage signals. Delete the block, or refactor
      env-gated suites to `if (cond) { describe(...) } else { describe('… (skipped)', () => {}) }`.

      See tickets/testing-floor/sdet-review/00-rollup.md for the rationale
      (14 critical findings traced directly to skipped/todo'd tests).

      Two narrow exemptions (documented with reason):
        - `tests/integration/**` — Playwright `test.skip(condition, reason)`
          is the canonical runtime env-gate when integration tests target
          external services (DB, SMTP, Keycloak) that may not be reachable
          on every dev machine. Refactoring to fail-instead-of-skip would
          change observable test outcome.
        - `modules/identity/test/bdd/runner.ts` — the BDD runner uses
          `it.skip` to surface scenarios that don't match the operator's
          active tag filter; the skip IS the desired user-visible signal.
    paths:
      include:
        - "adapters/"
        - "apps/"
        - "modules/"
        - "packages/"
        - "ports/"
        - "tests/"
        - "bundles/"
      exclude:
        - "tests/integration/"
        - "modules/identity/test/bdd/runner.ts"
    pattern-either:
      - pattern: it.skip(...)
      - pattern: it.todo(...)
      - pattern: test.skip(...)
      - pattern: test.todo(...)
      - pattern: describe.skip(...)
      - pattern: describe.todo(...)
      - pattern: xit(...)
      - pattern: xtest(...)
      - pattern: xdescribe(...)

  # --- Widget isolation: no cross-widget reach ----------------------------
  #
  # Ported from @atlas/eslint-plugin-widgets ▸ no-cross-widget-reach.
  # Widgets communicate only via context.channel (mediator) and
  # context.request (capability bridge). Anything that lets one widget
  # observe or influence another bypasses those gates.

  - id: atlas-widgets-no-cross-widget-reach
    languages: [typescript]
    severity: ERROR
    message: |
      Widgets cannot reach across widget boundaries. Use context.channel
      topics (mediator) or context.request (capability bridge) instead of
      globals, sibling imports, postMessage, or document.* DOM queries.
    paths:
      include:
        - "bundles/*/src/widgets/"
    pattern-either:
      - pattern: localStorage
      - pattern: sessionStorage
      - pattern: indexedDB
      - pattern: new BroadcastChannel(...)
      - pattern: new SharedWorker(...)
      - pattern: new MessageChannel(...)
      - pattern: window.parent
      - pattern: window.top
      - pattern: window.opener
      - pattern: self.parent
      - pattern: self.top
      - pattern: self.opener
      - pattern: globalThis.parent
      - pattern: globalThis.top
      - pattern: globalThis.opener
      - pattern: document.cookie
      - pattern: document.querySelector(...)
      - pattern: document.querySelectorAll(...)
      - pattern: document.getElementById(...)
      - pattern: document.getElementsByTagName(...)
      - pattern: document.getElementsByClassName(...)
      - pattern: document.getElementsByName(...)
      - pattern: $X.postMessage(...)
      - pattern: postMessage(...)

  # --- Widget isolation: no direct DOM access -----------------------------
  #
  # Ported from @atlas/eslint-plugin-widgets ▸ no-direct-dom. Widgets must
  # render through the `html` tagged template from @atlas/core. DOM API
  # access bypasses the signal-driven render path.

  - id: atlas-widgets-no-direct-dom
    languages: [typescript]
    severity: ERROR
    message: |
      Widgets cannot manipulate the DOM directly — render through the
      html`...` template from @atlas/core, declare event handlers as
      `@event=${handler}` bindings, and derive state from signals.
    paths:
      include:
        - "bundles/*/src/widgets/"
    pattern-either:
      - pattern: $X.innerHTML = $Y
      - pattern: $X.outerHTML = $Y
      - pattern: $X.textContent = $Y
      - pattern: $X.innerText = $Y
      - pattern: $X.createElement(...)
      - pattern: $X.createTextNode(...)
      - pattern: $X.createDocumentFragment(...)
      - pattern: $X.appendChild(...)
      - pattern: $X.removeChild(...)
      - pattern: $X.replaceChild(...)
      - pattern: $X.insertBefore(...)
      - pattern: $X.insertAdjacentHTML(...)
      - pattern: $X.insertAdjacentElement(...)
      - pattern: $X.attachShadow(...)
      - pattern: $X.cloneNode(...)
      - pattern: $X.getRootNode(...)
      - pattern: $X.addEventListener(...)
      - pattern: $X.removeEventListener(...)
      - pattern: this.shadowRoot
      - pattern: this.parentNode
      - pattern: this.parentElement
      - pattern: this.ownerDocument
      - pattern: this.nextSibling
      - pattern: this.previousSibling
      - pattern: this.firstChild
      - pattern: this.lastChild
      - pattern: this.childNodes
      - pattern: this.children
      - pattern: new MutationObserver(...)
      - pattern: new ResizeObserver(...)
      - pattern: new IntersectionObserver(...)

  # --- Widget isolation: no UI-blocking or off-bridge IO ------------------
  #
  # Ported from @atlas/eslint-plugin-widgets ▸ no-ui-blocking. Widgets must
  # use context.request(capability, args) for IO and avoid sync-blocking
  # APIs that stall the main thread.

  - id: atlas-widgets-no-ui-blocking
    languages: [typescript]
    severity: ERROR
    message: |
      Widgets cannot use sync-blocking APIs (alert/confirm/prompt) or do
      IO outside the capability bridge. Use context.request('<capability>',
      args) so the host can authorize and cancel; render confirmation UI
      in the widget body instead of native dialogs.
    paths:
      include:
        - "bundles/*/src/widgets/"
    pattern-either:
      - pattern: alert(...)
      - pattern: confirm(...)
      - pattern: prompt(...)
      - pattern: fetch(...)
      - pattern: eval(...)
      - pattern: navigator.sendBeacon(...)
      - pattern: new XMLHttpRequest(...)
      - pattern: new WebSocket(...)
      - pattern: new EventSource(...)
      - pattern: new Worker(...)
      - pattern: new SharedWorker(...)
      - pattern: new ServiceWorker(...)
      - pattern: new Function(...)
